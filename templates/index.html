<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Segment Predictor</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f3f6fb;display:flex;justify-content:center;padding:30px}
    .card{background:#fff;padding:24px;border-radius:12px;max-width:380px;width:100%;box-shadow:0 2px 10px #0002}
    h2{color:#1f3a6e;margin-top:0}
    label{display:block;margin-top:12px;font-size:14px}
    input{width:100%;padding:8px;margin-top:4px;box-sizing:border-box}
    button{margin-top:16px;width:100%;padding:10px;background:#1f3a6e;color:#fff;border:0;border-radius:6px;font-size:15px}
    .result{margin-top:18px;padding:12px;background:#e8f0ff;border-radius:8px}
  </style>
</head>
<body>
  <div class="card">
    <h2>Customer Segment Predictor</h2>
    <form method="POST">
      <label>Recency (days since last purchase)
        <input type="number" name="recency" min="0" required></label>
      <label>Frequency (number of orders)
        <input type="number" name="frequency" min="1" required></label>
      <label>Monetary (total spend)
        <input type="number" step="0.01" name="monetary" min="0" required></label>
      <button type="submit">Predict Segment</button>
    </form>
    {% if result %}
    <div class="result">
      <b>Segment: {{ result.segment }}</b>
      <p>{{ result.advice }}</p>
    </div>
    {% endif %}
  </div>
</body>
</html>
